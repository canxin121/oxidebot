[package]
name = "oxidebot-adapter-telegram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Telegram Bot API long-polling adapter for OxideBot"
readme = "README.md"
documentation = "https://docs.rs/oxidebot-adapter-telegram"
keywords = ["bot", "chatbot", "telegram", "oxidebot"]
categories = ["asynchronous", "api-bindings"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
oxidebot-core = { path = "../oxidebot-core", version = "1.0.0" }
oxidebot-runtime = { path = "../oxidebot-runtime", version = "1.0.0" }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
oxidebot-testkit = { path = "../oxidebot-testkit", version = "1.0.0" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
