[package]
name = "oxidebot-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded, structured-concurrency runtime for OxideBot"

[features]
default = ["signal"]
signal = ["tokio/signal"]
multi-thread = ["tokio/rt-multi-thread"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
oxidebot-core = { path = "../oxidebot-core", version = "1.0.0-alpha.1" }
mime_guess.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
