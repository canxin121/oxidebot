[workspace]
members = [
    "crates/oxidebot-core",
    "crates/oxidebot-macros",
    "crates/oxidebot-runtime",
    "crates/oxidebot",
    "crates/oxidebot-testkit",
    "crates/oxidebot-adapter-console",
    "examples/minimal",
    "examples/console-bot",
    "tests/renamed-facade",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["canxin121 <q1969730106@gmail.com>"]
repository = "https://github.com/canxin121/oxidebot"
homepage = "https://github.com/canxin121/oxidebot"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.91"
bytes = "1.10.1"
criterion = { version = "0.7.0", features = ["async_tokio"] }
futures-util = "0.3.31"
mime_guess = "2.0.5"
proc-macro2 = "1.0.106"
proc-macro-crate = "3.4.0"
quote = "1.0.45"
regex = "1.11.1"
syn = { version = "2.0.117", features = ["full"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.17"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.16", default-features = false }
tracing = "0.1.44"
trybuild = "1.0.116"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release-small]
inherits = "release"
panic = "abort"

[profile.bench]
debug = 1
