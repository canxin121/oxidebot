name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.48.0

  quality:
    name: Quality / Rust ${{ matrix.rust }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --workspace --all-targets --all-features --locked
      - run: cargo +stable doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable check -p oxidebot-runtime --no-default-features --locked
      - run: cargo +stable check -p oxidebot-runtime --no-default-features --features multi-thread --locked
      - run: cargo +stable check -p oxidebot --no-default-features --locked
      - run: cargo +stable check -p oxidebot --no-default-features --features multi-thread --locked

  published-api-docs:
    name: Published API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Require documentation for every published API
        env:
          RUSTDOCFLAGS: -Dwarnings -Dmissing-docs
        shell: bash
        run: |
          set -euo pipefail
          for package in oxidebot-core oxidebot-macros oxidebot-runtime oxidebot oxidebot-testkit oxidebot-adapter-console oxidebot-adapter-telegram; do
            cargo +stable doc -p "$package" --no-deps --all-features --locked
          done

  supply-chain:
    name: Supply chain and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - run: cargo +stable deny check
      - run: cargo +stable install cargo-machete --version 0.9.2 --locked
      - run: cargo +stable machete
      - name: Inspect every publishable source package
        run: |
          for package in oxidebot-core oxidebot-macros oxidebot-runtime oxidebot oxidebot-testkit oxidebot-adapter-console oxidebot-adapter-telegram; do
            cargo +stable package -p "$package" --list --allow-dirty --locked
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
          fallback: none
      - run: cargo +stable llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  fuzz-build:
    name: Fuzz target build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz build command_parser
